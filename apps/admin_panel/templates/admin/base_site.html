{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Scanline Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}">
    <i class="fas fa-bolt" style="color: var(--scan); margin-right: 6px;"></i>
    SCAN<span class="sl-accent">LINE</span>
    <span class="sl-sub">ADMIN</span>
  </a>
</h1>
{% endblock %}

{% block nav-global %}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #080a0e;
    --panel: #111418;
    --panel-border: #1c2128;
    --panel-hover: #252c36;
    --text: #e6e9ed;
    --text-dim: #6f7882;
    --text-dimmer: #40464f;
    --scan: #39ff88;
    --scan-dim: rgba(57, 255, 136, 0.12);
    --scan-glow: rgba(57, 255, 136, 0.25);
    --warn: #ffb454;
    --fail: #ff5c5c;
    --info: #5ec8ff;
    --radius: 10px;
    --shadow: 0 8px 24px rgba(0,0,0,0.6);
    --transition: 0.2s ease;
    --font-sans: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  body {
    background: var(--bg) !important;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
  }
 
  #header {
    background: var(--panel) !important;
    border-bottom: 1px solid var(--panel-border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #branding h1, #branding h1 a:link, #branding h1 a:visited {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: var(--text) !important;
  }
  .sl-accent { color: var(--scan); }
  .sl-sub { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 4px; }

  #user-tools {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  #user-tools a { color: var(--text-dim); text-decoration: none; border-bottom: 1px dashed transparent; transition: border var(--transition); }
  #user-tools a:hover { border-bottom-color: var(--scan); color: var(--scan); }

  
  div.breadcrumbs {
    background: var(--bg);
    border-bottom: 1px solid var(--panel-border);
    color: var(--text-dimmer);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 8px 24px;
  }
  div.breadcrumbs a { color: var(--text-dim); }
  div.breadcrumbs a:hover { color: var(--scan); }

 
  #content { padding: 24px; background: var(--bg); }
  #content-main { max-width: 1400px; margin: 0 auto; }

 
  .module {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    transition: border var(--transition), box-shadow var(--transition);
  }
  .module:hover { border-color: var(--panel-hover); box-shadow: var(--shadow); }
  .module h2, .module caption, .inline-group h2 {
    background: var(--panel) !important;
    border-bottom: 1px solid var(--panel-border);
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim) !important;
    padding: 12px 16px;
    margin: 0;
  }
  .module table { background: transparent; width: 100%; border-collapse: collapse; }
  .module th, .module td {
    border-bottom: 1px solid var(--panel-border) !important;
    padding: 10px 16px;
    color: var(--text);
  }
  .module th a, .module td a { color: var(--text) !important; transition: color var(--transition); }
  .module th a:hover, .module td a:hover { color: var(--scan) !important; }
  .module td.addlink a, .module td.changelink a {
    color: var(--text-dim) !important;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    transition: all var(--transition);
  }
  .module td.addlink a:hover, .module td.changelink a:hover {
    border-color: var(--scan);
    color: var(--scan) !important;
    background: var(--scan-dim);
  }

 
  #changelist table thead th {
    background: var(--panel);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--panel-border);
    padding: 10px 12px;
  }
  #changelist table tbody td, #changelist table tbody th {
    background: var(--bg);
    border-bottom: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 12px;
  }
  #changelist table tbody tr:hover td { background: var(--panel); }

  #changelist-filter {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 12px;
  }
  #changelist-filter h2 {
    background: transparent !important;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0 0 8px 0;
    border-bottom: 1px solid var(--panel-border);
  }
  #changelist-filter li.selected a { color: var(--scan); }
  #changelist-filter a { color: var(--text-dim); transition: color var(--transition); }
  #changelist-filter a:hover { color: var(--text); }

 
  .button, input[type=submit], input[type=button], .submit-row input {
    background: var(--scan-dim);
    border: 1px solid rgba(57,255,136,0.3);
    color: var(--scan);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    border-radius: 6px;
    padding: 6px 14px;
    transition: all var(--transition);
  }
  .button:hover, input[type=submit]:hover {
    background: var(--scan);
    color: var(--bg);
    border-color: var(--scan);
  }
  .button.default { background: var(--scan); color: var(--bg); }
  .button.default:hover { background: #2ee67a; }
 
  ul.messagelist li {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-sans);
    padding: 10px 16px;
  }
  ul.messagelist li.success { border-left: 4px solid var(--scan); }
  ul.messagelist li.warning { border-left: 4px solid var(--warn); }
  ul.messagelist li.error { border-left: 4px solid var(--fail); }
 
  input, textarea, select, .vTextField {
    background: var(--panel) !important;
    border: 1px solid var(--panel-border) !important;
    color: var(--text) !important;
    border-radius: 6px;
    padding: 6px 10px;
  }
  label { color: var(--text-dim); font-weight: 500; }

  #footer {
    color: var(--text-dimmer);
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 16px 24px;
    border-top: 1px solid var(--panel-border);
    margin-top: 24px;
  }
 
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--panel-hover); }
 
  .dashboard-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    transition: border var(--transition), box-shadow var(--transition);
  }
  .dashboard-card:hover {
    border-color: var(--panel-hover);
    box-shadow: var(--shadow);
  }
  .dashboard-card h3 {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 8px 0;
  }
  .dashboard-card .value {
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .dashboard-card .value.accent { color: var(--scan); }
</style>
{% endblock %}
